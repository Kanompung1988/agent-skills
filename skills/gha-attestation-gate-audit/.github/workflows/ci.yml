name: Independent Skill CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'PyYAML>=6,<7'
      - name: Test all cases
        run: python -m unittest discover -s tests -v
      - name: Safe fixture smoke
        run: |
          python scripts/audit.py examples/safe.yml --json > /tmp/safe.json
          python -c 'import json; assert json.load(open("/tmp/safe.json"))["count"] == 0'
      - name: Review fixture smoke
        shell: bash
        run: |
          set +e
          python scripts/audit.py examples/review.yml --json > /tmp/review.json
          code=$?
          test "$code" -eq 1 || exit 1
          python -c 'import json; assert json.load(open("/tmp/review.json"))["count"] >= 2'
      - name: Skill frontmatter smoke
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path("SKILL.md").read_text(encoding="utf8")
          chunks = s.split("---", 2)
          assert len(chunks) == 3 and not chunks[0]
          header = chunks[1]
          assert re.search(r"^name: [a-z0-9]+(?:-[a-z0-9]+)*$", header, re.M)
          assert re.search(r"^description: .+", header, re.M)
          assert len(s.splitlines()) < 500
          PY
