name: Test npm trusted publisher audit
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/audit.py examples/safe --json
      - name: Verify review fixture and JSON
        shell: bash
        run: |
          set +e
          python scripts/audit.py examples/review --json > /tmp/review.json
          rc=$?
          set -e
          test "$rc" -eq 1
          python -c 'import json; j=json.load(open("/tmp/review.json")); assert j["count"] >= 3 and j["count"] == len(j["findings"])'
      - name: Skill metadata validity
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, yaml
          t=Path("SKILL.md").read_text()
          m=re.match(r"^---\n(.*?)\n---\n",t,re.S)
          assert m
          d=yaml.safe_load(m.group(1))
          assert d["name"]==Path.cwd().name
          assert re.fullmatch(r"[a-z][a-z0-9]*(?:-[a-z0-9]+)*",d["name"])
          assert 1<=len(d["description"])<=1024
          assert all(Path(p).exists() for p in ["README.md","LICENSE","references/SOURCES.md","assets/areazero-logo.svg"])
          PY
