name: Test Agent Skill
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install offline CLI dependency
        run: python -m pip install -r requirements.txt
      - name: Install official Agent Skills reference validator
        if: matrix.python-version == '3.12'
        run: python -m pip install "git+https://github.com/agentskills/agentskills.git@83021e2be457a9b6679148719c1f6074f0ad975e#subdirectory=skills-ref"
      - name: Validate Agent Skills specification
        if: matrix.python-version == '3.12'
        run: cd .. && skills-ref validate "$(basename "$GITHUB_WORKSPACE")"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check Agent Skill frontmatter and official logo integrity
        run: python tests/verify_package.py
      - name: Safe CLI fixture must exit zero
        run: python scripts/audit.py fixtures/safe.yaml --format json
      - name: Review CLI fixture must exit two
        shell: bash
        run: |
          set +e
          python scripts/audit.py fixtures/review.yaml --format json
          status=$?
          set -e
          test "$status" -eq 2
