apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: backups
driver: example.csi
deletionPolicy: Delete
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata:
  name: daily
  namespace: demo
spec:
  source: {persistentVolumeClaimName: external-pvc}
  volumeSnapshotClassName: backups
