name: Independent Skill CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Unit regression tests
        run: python -m unittest discover -s tests -v
      - name: Safe CLI fixture
        run: |
          python scripts/audit.py examples/safe.yaml --json > /tmp/safe.json
          python -c 'import json; r=json.load(open("/tmp/safe.json")); assert r["count"] == 0, r'
      - name: Review CLI fixture
        shell: bash
        run: |
          set +e
          python scripts/audit.py examples/review.yaml --json > /tmp/review.json
          ret=$?
          test "$ret" -eq 1 || exit 1
          python -c 'import json; r=json.load(open("/tmp/review.json")); assert r["count"] >= 2, r'
      - name: Agent Skills and SVG integrity
        run: |
          python - <<'PY'
          import re, yaml, hashlib, pathlib, xml.etree.ElementTree as ET
          text=pathlib.Path("SKILL.md").read_text()
          assert text.startswith("---\n")
          front=yaml.safe_load(text.split("---",2)[1]); assert front["name"]=="k8s-topology-spread-audit"
          assert 1 <= len(front["description"]) <= 1024
          assert re.fullmatch("[a-z0-9]+(?:-[a-z0-9]+)*",front["name"])
          assert hashlib.sha256(pathlib.Path("assets/areazero-logo.svg").read_bytes()).hexdigest()=="89b459e6a4e61748d2d56d54da2cd17ff2b55deafbbc90e45e43d4c319462d16"
          ET.parse("assets/areazero-logo.svg"); ET.parse("assets/hero.svg")
          PY
