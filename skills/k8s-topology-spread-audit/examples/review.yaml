apiVersion: apps/v1
kind: Deployment
metadata: {name: bad-spread}
spec:
  template:
    metadata:
      labels: {app: api}
    spec:
      topologySpreadConstraints:
        - maxSkew: 0
          topologyKey: ""
          whenUnsatisfiable: ScheduleAnyway
          minDomains: 3
          labelSelector: {matchLabels: {app: other}}
