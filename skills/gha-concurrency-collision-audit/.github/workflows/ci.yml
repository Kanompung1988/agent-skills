name: Independent Skill CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/audit.py examples/safe.yml --json > /tmp/safe.json
      - run: python -c 'import json; assert json.load(open("/tmp/safe.json"))["count"]==0'
      - shell: bash
        run: |
          set +e
          python scripts/audit.py examples/review.yml --json > /tmp/review.json
          rc=$?
          test "$rc" -eq 1 || exit 1
          python -c 'import json; assert json.load(open("/tmp/review.json"))["count"]>=3'
      - run: |
          python - <<'PY'
          from pathlib import Path
          import yaml,re
          s=Path('SKILL.md').read_text()
          assert s.startswith('---\n')
          m=yaml.safe_load(s.split('---',2)[1])
          assert m['name']=='gha-concurrency-collision-audit'
          assert re.fullmatch(r'[a-z0-9]+(?:-[a-z0-9]+)*',m['name'])
          assert 0<len(m['description'])<=1024
          PY
