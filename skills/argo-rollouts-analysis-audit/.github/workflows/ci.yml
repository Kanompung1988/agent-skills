name: Independent Skill CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'PyYAML>=6,<7'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Safe fixture
        run: |
          python scripts/audit.py examples/safe.yaml --json > /tmp/safe.json
          python -c 'import json; assert json.load(open("/tmp/safe.json"))["count"] == 0'
      - name: Review fixture
        shell: bash
        run: |
          set +e
          python scripts/audit.py examples/review.yaml --json > /tmp/review.json
          code=$?
          test "$code" -eq 1 || exit 1
          python -c 'import json; assert json.load(open("/tmp/review.json"))["count"] >= 3'
      - name: Agent Skills frontmatter smoke
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("SKILL.md").read_text()
          assert s.startswith("---\n")
          a=s.split("---",2)[1]
          assert re.search(r"^name: argo-rollouts-analysis-audit$",a,re.M)
          assert re.search(r"^description: .{20,1024}$",a,re.M)
          assert len(s.splitlines())<500
          PY
