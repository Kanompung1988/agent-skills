name: Tests and CLI smoke
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Safe fixture no findings
        run: python scripts/audit.py examples/safe.tf --json
      - name: Flagged fixture produces findings
        shell: bash
        run: |
          set +e
          python scripts/audit.py examples/review.tf --json > /tmp/findings.json
          status=$?
          set -e
          test "$status" -eq 1
          python -c 'import json;d=json.load(open("/tmp/findings.json"));assert d["findings"]'
      - name: Validate Agent Skills frontmatter locally
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,yaml
          s=Path('SKILL.md').read_text()
          m=re.match(r'^---\n(.*?)\n---\n',s,re.S)
          assert m
          f=yaml.safe_load(m.group(1))
          assert f['name']==Path.cwd().name
          assert re.fullmatch(r'[a-z0-9]+(?:-[a-z0-9]+)*',f['name'])
          assert len(f['name'])<=64 and 1<=len(f['description'])<=1024
          assert len(f['compatibility'])<=500
          assert all(isinstance(v,str) for v in f['metadata'].values())
          PY
