name: Independent Skill CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Safe fixture
        run: python scripts/audit.py examples/safe.conf
      - name: Review fixture
        shell: bash
        run: |
          set +e
          python scripts/audit.py examples/review.conf --json > /tmp/review.json
          status=$?
          test "$status" -eq 1
          python -c 'import json; d=json.load(open("/tmp/review.json")); assert d["count"] > 0'
      - name: Skill specification smoke
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path("SKILL.md").read_text()
          assert text.startswith("---\n")
          assert "name: nginx-header-inheritance-audit\n" in text.split("---",2)[1]
          assert "description:" in text.split("---",2)[1]
          assert len(text.splitlines()) < 500
          PY
