apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata
handler: kata-qemu
spec:
  handler: kata-qemu
  overhead:
    podFixed:
      cpu: 120m
      memory: 64Mi
  scheduling:
    nodeSelector:
      runtime.example.com/kata: "true"
    tolerations:
      - key: runtime.example.com/kata
        operator: Equal
        value: "true"
        effect: NoSchedule
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      runtimeClassName: kata
      nodeSelector:
        runtime.example.com/kata: "true"
      containers:
        - name: api
          image: example/api:v1
