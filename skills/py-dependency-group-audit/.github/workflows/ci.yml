name: Independent Skill CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prerequisites
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Safe fixture (exit 0)
        run: python scripts/audit.py examples/safe.toml
      - name: Review fixture (expected exit 1)
        shell: bash
        run: |
          set +e
          python scripts/audit.py examples/review.toml --json > /tmp/review.json
          result=$?
          test "$result" -eq 1
          python -c 'import json; data=json.load(open("/tmp/review.json")); assert data["count"] > 0'
      - name: Agent Skill metadata
        run: |
          python - <<'PYCHECK'
          from pathlib import Path
          import re
          text = Path("SKILL.md").read_text()
          assert text.startswith("---\n")
          assert re.search(r"^name: py-dependency-group-audit$", text, re.M)
          assert re.search(r"^description: .{30,}$", text, re.M)
          assert len(text.splitlines()) < 500
          PYCHECK
