apiVersion: apps/v1
kind: Deployment
metadata: {name: api}
spec:
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
      - name: api
        ports: [{name: web, containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: api}
spec:
  selector: {app: api}
  ports: [{port: 80, targetPort: http}]

---
apiVersion: v1
kind: Service
metadata: {name: missing}
spec:
  selector: {app: absent}
  ports: [{port: 80, targetPort: http}]
