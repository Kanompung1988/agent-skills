apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: checkout, namespace: storefront}
spec:
  parentRefs: [{name: public-gateway}]
  rules:
    - backendRefs: [{name: checkout, namespace: backend, port: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata: {name: grant-checkout, namespace: backend}
spec:
  from: [{group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: storefront}]
  to: [{group: "", kind: Service, name: checkout}]
