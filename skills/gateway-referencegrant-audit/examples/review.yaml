apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: public, namespace: storefront}
spec:
  parentRefs: [{name: public-gateway}]
  rules:
    - backendRefs:
        - {name: payments, namespace: finance, port: 8080}
        - {name: profiles, namespace: identity, port: 8080}
---
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata: {name: wrong-source, namespace: finance}
spec:
  from: [{group: gateway.networking.k8s.io, kind: GRPCRoute, namespace: storefront}]
  to: [{group: "", kind: Service, name: payments}]
