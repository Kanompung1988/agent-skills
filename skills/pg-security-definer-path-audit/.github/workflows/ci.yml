name: Independent Agent Skill CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate Agent Skills frontmatter and files
        run: python tests/check_metadata.py
      - name: Unit regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Safe synthetic fixture
        run: python scripts/audit.py fixtures/safe.sql --strict
      - name: Review synthetic fixture
        shell: bash
        run: |
          set +e
          python scripts/audit.py fixtures/review.sql --format json --strict > /tmp/review.json
          code=$?
          set -e
          test "$code" -eq 2
          python -c 'import json; assert json.load(open("/tmp/review.json"))["count"] >= 2'
