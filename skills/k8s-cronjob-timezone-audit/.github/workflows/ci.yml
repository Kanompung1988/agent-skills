name: Tests and CLI smoke
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Safe fixture must be clean
        run: python scripts/audit.py examples/safe.yaml --json
      - name: Review fixture must flag findings
        shell: bash
        run: |
          set +e
          python scripts/audit.py examples/review.yaml --json > /tmp/findings.json
          status=$?
          set -e
          test "$status" -eq 1
          python -c 'import json; d=json.load(open("/tmp/findings.json")); assert d["findings"]'
      - name: Validate skill frontmatter
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('SKILL.md').read_text()
          assert s.startswith('---\n')
          m=re.match(r'---\n(.*?)\n---\n',s,re.S)
          assert m, 'frontmatter missing'
          import yaml
          meta=yaml.safe_load(m.group(1))
          assert meta['name']==Path.cwd().name
          assert re.fullmatch('[a-z][a-z0-9]*(?:-[a-z0-9]+)*',meta['name'])
          assert 1<=len(meta['description'])<=1024
          PY
