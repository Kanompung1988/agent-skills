apiVersion: v1
kind: Pod
metadata:
  name: api-0
  namespace: production
  labels: {app: api, role: backend}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-wide
  namespace: production
spec:
  minAvailable: 1
  selector: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-specific
  namespace: production
spec:
  maxUnavailable: 0
  selector:
    matchLabels: {app: api}
