name: Independent Skill CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - name: Safe fixture smoke
        run: |
          python scripts/audit.py . --json > /tmp/skill-safe.json
          python -c 'import json; x=json.load(open("/tmp/skill-safe.json")); assert x["count"] == 0'
      - name: Spec frontmatter smoke
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('SKILL.md').read_text()
          head=s.split('---',2)
          assert len(head)==3 and head[0]==''
          assert 'name: git-submodule-boundary-audit' in head[1]
          assert re.fullmatch(r'[a-z0-9]+(?:-[a-z0-9]+)*','git-submodule-boundary-audit')
          assert 'description:' in head[1]
          assert len(s.splitlines())<500
          PY
