apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storefront
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  source:
    repoURL: https://example.invalid/config.git
    path: manifests
    targetRevision: HEAD
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
