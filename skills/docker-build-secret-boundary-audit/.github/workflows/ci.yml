name: Independent Skill CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/audit.py examples/safe.Dockerfile --json > /tmp/safe.json
      - run: python -c 'import json; assert json.load(open("/tmp/safe.json"))["count"]==0'
      - shell: bash
        run: |
          set +e
          python scripts/audit.py examples/review.Dockerfile --json > /tmp/review.json
          rc=$?
          test "$rc" -eq 1 || exit 1
          python -c 'import json; assert json.load(open("/tmp/review.json"))["count"]>=3'
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('SKILL.md').read_text()
          assert s.startswith('---\n')
          assert 'name: docker-build-secret-boundary-audit' in s
          assert 'description:' in s
          assert re.fullmatch(r'[a-z0-9]+(?:-[a-z0-9]+)*','docker-build-secret-boundary-audit')
          PY
