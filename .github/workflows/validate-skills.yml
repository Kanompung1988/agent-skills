name: Validate agent skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / offline QA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile scripts
        run: python -m compileall -q skills tests scripts
      - name: OpenAPI compatibility tests
        run: python -m unittest discover -s skills/openapi-compat-audit/tests -v
      - name: CI log triage tests
        run: python -m unittest discover -s skills/ci-log-triage/tests -v
      - name: Distribution & metadata tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce documented examples
        run: python scripts/smoke_examples.py
