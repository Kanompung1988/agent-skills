  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#152C40"/><stop offset="1" stop-color="#0A1728"/></linearGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#7DAEC1" stroke-opacity=".09" stroke-width="1"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
