<text x="323" y="427" fill="#E4FAFF" font-size="18" font-weight="700">Offline by default</text>
<text x="65" y="513" fill="#7691A4" font-size="15" letter-spacing="2">EVIDENCE OVER HYPE  //  2026 EDITION</text>
